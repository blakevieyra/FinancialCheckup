databases:
  - name: financialcheckup-db
    databaseName: financialcheckup
    user: financialcheckup
    # basic-256mb (~$6/mo, 256 MB RAM, 1 GB storage) — cheapest paid Postgres on Render's
    # new flexible plan lineup. Required because this account already has a free Postgres
    # in use by another project, and Render allows only one free Postgres per workspace.
    # Note: blueprint YAML uses hyphens (basic-256mb); the REST API uses underscores.
    plan: basic-256mb

services:
  - type: web
    name: financialcheckup-api
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: financialcheckup-db
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: API_PUBLIC_URL
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: WEEKLY_DIGEST_TZ
        value: America/Los_Angeles
      - key: ADMIN_DIGEST_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_MONTHLY
        value: price_1TUycJ1HZuIni9E7ytJFBYib
      - key: STRIPE_PRICE_ANNUAL
        value: price_1TZwxo1HZuIni9E76TvK70yS
      - key: STRIPE_TRIAL_OFFER
        value: to_1TkD071HZuIni9E78QjISlD2
      - key: STRIPE_PRICE_TRIAL_WEEKLY
        value: price_1TkBcv1HZuIni9E77RYcHPxd
      - key: STRIPE_TRIAL_DAYS
        value: "7"
      - key: PG_POOL_MAX
        value: "10"
  - type: web
    env: static
    name: financialcheckup-web
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
